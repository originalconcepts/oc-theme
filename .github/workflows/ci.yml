name: CI

on:
  push:
    branches: [main]
  pull_request:

# A red check here is the whole point of stage 1. Nothing merges past it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guards:
    name: Project guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run forbidden-pattern guards
        run: bash tools/forbidden.sh

  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Lint PHP syntax
        run: |
          find theme plugins -name '*.php' -not -path '*/vendor/*' -print0 \
            | xargs -0 -n1 -P4 php -l

      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.json') }}

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: PHPCS
        run: composer run lint

      - name: PHPStan
        run: composer run analyse

  js:
    name: Blocks build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - name: Lint
        run: npm run lint:js
      - name: Build
        run: npm run build

      - name: Fail if the build left more than one bundle
        # oc-main-theme shipped main.ae95360e.js and main.eb0bbfcc.js side by side,
        # and the enqueue loaded both into the same React root. Never again.
        run: |
          count=$(find plugins/*/build -name 'index.js' | wc -l)
          echo "built entrypoints: $count"
          test "$count" -eq 1
