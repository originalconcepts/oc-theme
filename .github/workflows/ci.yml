name: CI

on:
  push:
    branches: [main]
  pull_request:

# A red check here is the whole point of stage 1. Nothing merges past it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guards:
    name: Project guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run forbidden-pattern guards
        run: bash tools/forbidden.sh

  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Lint PHP syntax
        run: |
          find theme plugins -name '*.php' -not -path '*/vendor/*' -print0 \
            | xargs -0 -n1 -P4 php -l

      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.json') }}

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: PHPCS
        run: composer run lint

      - name: PHPStan
        run: composer run analyse

      - name: PHPUnit
        run: composer run test

  js:
    name: Blocks build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check whether any block sources exist yet
        id: src
        run: |
          if compgen -G "plugins/*/src/*/block.json" > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No block sources yet — nothing to build."
          fi

      - uses: actions/setup-node@v4
        if: steps.src.outputs.exists == 'true'
        with:
          node-version: 20
          # cache:npm returns once package-lock.json is committed with the first block

      - name: Install
        if: steps.src.outputs.exists == 'true'
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Lint
        if: steps.src.outputs.exists == 'true'
        run: npm run lint:js

      - name: Build
        if: steps.src.outputs.exists == 'true'
        run: npm run build

      - name: Every source block must build to exactly one entrypoint
        # The old plugin shipped main.ae95360e.js and main.eb0bbfcc.js side by
        # side and loaded both into the same React root. With wp-scripts each
        # block builds one unhashed index.js, so src and build must match 1:1.
        if: steps.src.outputs.exists == 'true'
        run: |
          src=$(ls -d plugins/*/src/*/ | wc -l)
          built=$(find plugins/*/build -name index.js | wc -l)
          echo "source blocks: $src   built entrypoints: $built"
          test "$src" -eq "$built"
