name: Release

# Tag v1.2.3 → build → attach oc-theme.zip and oc-blocks.zip to the release.
# The updater on every client site reads exactly these assets. There is no
# other distribution path, and nothing is built on a developer's machine.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Refuse to release if the version headers disagree with the tag
        run: |
          v="${{ steps.v.outputs.version }}"
          theme=$(grep -m1 '^ \* Version:' theme/style.css | tr -d ' ' | cut -d: -f2)
          blocks=$(grep -m1 '^ \* Version:' plugins/oc-blocks/oc-blocks.php | tr -d ' ' | cut -d: -f2)
          echo "tag=$v theme=$theme blocks=$blocks"
          test "$theme" = "$v"
          test "$blocks" = "$v"

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build blocks
        run: |
          npm ci
          npm run build

      - name: Stage artefacts
        run: |
          mkdir -p dist
          # Theme: source only, no dev tooling.
          rsync -a --exclude-from=.distignore theme/ "dist/oc-theme/"
          rsync -a --exclude-from=.distignore plugins/oc-blocks/ "dist/oc-blocks/"
          cd dist
          zip -rq oc-theme.zip  oc-theme
          zip -rq oc-blocks.zip oc-blocks
          ls -la

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/oc-theme.zip
            dist/oc-blocks.zip
          generate_release_notes: true
