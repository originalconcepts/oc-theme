name: Release

# Tag v1.2.3 → build → attach oc-theme.zip and oc-blocks.zip to the release.
# The updater on every client site reads exactly these assets. There is no
# other distribution path, and nothing is built on a developer's machine.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Refuse to release if the version headers disagree with the tag
        run: |
          v="${{ steps.v.outputs.version }}"
          theme=$(grep -m1 '^ \* Version:' theme/style.css | tr -d ' ' | cut -d: -f2)
          echo "tag=$v theme=$theme"
          test "$theme" = "$v"
          for dir in plugins/*/; do
            name=$(basename "$dir")
            got=$(grep -m1 '^ \* Version:' "$dir$name.php" | tr -d ' ' | cut -d: -f2)
            echo "  $name=$got"
            test "$got" = "$v"
          done

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2
      # No lockfile in this repository — the machine the theme is written on
      # has no Node, so the lockfile would go stale the moment it was made.
      # Plain install, no cache keyed on a file that does not exist.
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build blocks
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Stage artefacts
        run: |
          mkdir -p dist
          # Theme: source only, no dev tooling.
          rsync -a --exclude-from=.distignore theme/ "dist/oc-theme/"
          for dir in plugins/*/; do
            name=$(basename "$dir")
            rsync -a --exclude-from=.distignore "$dir" "dist/$name/"
          done
          cd dist
          for d in */; do zip -rq "${d%/}.zip" "${d%/}"; done
          ls -la

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
